<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Builder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 text-gray-800 dark:text-gray-200">
    <!-- Header -->
    <header class="relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-r from-purple-500 to-pink-500 animate-pulse-slow opacity-70"></div>
      <div class="relative z-10 container mx-auto px-4 py-8">
        <h1 class="text-4xl sm:text-5xl font-extrabold text-center text-white drop-shadow-sm transition-transform transform hover:scale-105">
          Survey Builder
        </h1>
      </div>
    </header>

    <div id="root" class="container mx-auto px-4 my-8"></div>

    <!-- React and Babel -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.0.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.0.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-standalone@6.26.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/babel">
      const React = window.React;
      const ReactDOM = window.ReactDOM;
      const { useState, useEffect, createContext, useContext } = React;

      // Survey Context
      const SurveyContext = createContext();

      const SurveyContextProvider = ({ children }) => {
        const [pages, setPages] = useState([]);
        const [currentPageIndex, setCurrentPageIndex] = useState(-1);
        const [previewPageIndex, setPreviewPageIndex] = useState(0);

        useEffect(() => {
          loadFromLocalStorage();
          setupSampleSurvey();
        }, []);

        useEffect(() => {
          saveToLocalStorage();
        }, [pages]);

        const loadFromLocalStorage = () => {
          const storedData = localStorage.getItem('surveyData');
          if (storedData) {
            const parsedData = JSON.parse(storedData);
            setPages(parsedData);
            if (parsedData.length > 0) {
              setCurrentPageIndex(0);
            }
          }
        };

        const saveToLocalStorage = () => {
          localStorage.setItem('surveyData', JSON.stringify(pages));
        };

        const addPage = (newPage) => {
          setPages([...pages, newPage]);
          setCurrentPageIndex(pages.length);
        };

        const updatePage = (index, updatedPage) => {
          const updatedPages = [...pages];
          updatedPages[index] = updatedPage;
          setPages(updatedPages);
        };

        const deletePage = (index) => {
          const updatedPages = pages.filter((_, i) => i !== index);
          setPages(updatedPages);
          if (updatedPages.length === 0) {
            setCurrentPageIndex(-1);
            setPreviewPageIndex(0);
          } else {
            setCurrentPageIndex(Math.max(0, currentPageIndex - 1));
            setPreviewPageIndex(Math.min(previewPageIndex, updatedPages.length - 1));
          }
        };

        const selectPage = (index) => {
          setCurrentPageIndex(index);
        };

        const movePageUp = (index) => {
          if (index <= 0) return;
          const updatedPages = [...pages];
          [updatedPages[index - 1], updatedPages[index]] = [updatedPages[index], updatedPages[index - 1]];
          setPages(updatedPages);
          if (currentPageIndex === index) {
            setCurrentPageIndex(index - 1);
          } else if (currentPageIndex === index - 1) {
            setCurrentPageIndex(index);
          }
        };

        const movePageDown = (index) => {
          if (index >= pages.length - 1) return;
          const updatedPages = [...pages];
          [updatedPages[index + 1], updatedPages[index]] = [updatedPages[index], updatedPages[index + 1]];
          setPages(updatedPages);
          if (currentPageIndex === index) {
            setCurrentPageIndex(index + 1);
          } else if (currentPageIndex === index + 1) {
            setCurrentPageIndex(index);
          }
        };

        const addQuestion = (pageIndex, newQuestion) => {
          if (pageIndex === -1) return;
          const updatedPages = [...pages];
          updatedPages[pageIndex].questions = [...updatedPages[pageIndex].questions, newQuestion];
          setPages(updatedPages);
        };

        const updateQuestion = (pageIndex, questionIndex, updatedQuestion) => {
          if (pageIndex === -1) return;
          const updatedPages = [...pages];
          updatedPages[pageIndex].questions[questionIndex] = updatedQuestion;
          setPages(updatedPages);
        };


        const deleteQuestion = (pageIndex, questionIndex) => {
          if (pageIndex === -1) return;
          const updatedPages = [...pages];
          updatedPages[pageIndex].questions = updatedPages[pageIndex].questions.filter((_, i) => i !== questionIndex);
          setPages(updatedPages);
        };

        const showPreviousPreviewPage = () => {
          if (previewPageIndex > 0) {
            setPreviewPageIndex(previewPageIndex - 1);
          }
        };

        const showNextPreviewPage = () => {
          if (previewPageIndex < pages.length - 1) {
            setPreviewPageIndex(previewPageIndex + 1);
          }
        };

        const setupSampleSurvey = () => {
          if (pages.length === 0) {
            addSamplePages();
          }
        };

        const addSamplePages = () => {
          const samplePages = [
            {
              title: "Customer Satisfaction Survey - Page 1",
              pageType: "survey",
              questions: [
                {
                  contextElements: [
                    { type: 'paragraph', content: 'We value your input! Please provide your contact information below.' },
                    { type: 'image', content: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=400&q=80' }
                  ],
                  type: "text",
                  text: "What is your name?"
                },
                {
                  type: "text",
                  text: "What is your email address?"
                }
              ]
            },
            {
              title: "Information Page - About Us",
              pageType: "info",
              questions: [],
              contextElements: [
                { type: 'paragraph', content: 'Discover our journey. We are dedicated to innovation and excellence.' },
                { type: 'image', content: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=400&q=80' }
              ]
            },
            {
              title: "Customer Satisfaction Survey - Page 2",
              pageType: "survey",
              questions: [
                {
                  contextElements: [
                    { type: 'video', content: 'https://www.youtube.com/embed/dQw4w9WgXcQ' }
                  ],
                  type: "radio",
                  text: "How satisfied are you with our service?",
                  options: ["Very Satisfied", "Satisfied", "Neutral", "Dissatisfied", "Very Dissatisfied"]
                },
                {
                  type: "checkbox",
                  text: "Which aspects of our service did you like?",
                  options: ["Speed", "Quality", "Price", "Support", "Ease of Use"]
                }
              ]
            }
          ];
          setPages(samplePages);
          setCurrentPageIndex(0);
        };


        const value = {
          pages,
          currentPageIndex,
          previewPageIndex,
          setPages,
          setCurrentPageIndex,
          setPreviewPageIndex,
          addPage,
          updatePage,
          deletePage,
          selectPage,
          movePageUp,
          movePageDown,
          addQuestion,
          updateQuestion,
          deleteQuestion,
          showPreviousPreviewPage,
          showNextPreviewPage,
        };

        return (
          <SurveyContext.Provider value={value}>
            {children}
          </SurveyContext.Provider>
        );
      };


      // Context Element Component
      const ContextElements = ({ elements }) => {
        if (!elements || elements.length === 0) {
          return null;
        }
        return (
          <div className="space-y-4">
            {elements.map((element, index) => {
              if (element.type === 'paragraph') {
                return <p key={index} className="text-base">{element.content}</p>;
              } else if (element.type === 'image') {
                return <img key={index} src={element.content} alt="Context" className="w-full rounded-lg shadow-sm" />;
              } else if (element.type === 'video') {
                return (
                  <div key={index} className="w-full aspect-video rounded-lg overflow-hidden shadow-sm">
                    <iframe src={element.content} title="Video" className="w-full h-full" frameBorder="0" allowFullScreen></iframe>
                  </div>
                );
              }
              return null;
            })}
          </div>
        );
      };

      // Question Component for Builder
      const Question = ({ question, index, openQuestionModal, deleteQuestion }) => {
        const { currentPageIndex } = useContext(SurveyContext);
        const handleDeleteQuestion = () => {
          deleteQuestion(currentPageIndex, index);
        };

        return (
          <div key={index} className="border rounded-xl p-6 bg-white dark:bg-gray-800 shadow-sm hover:shadow transition-shadow relative">
            {question.contextElements && question.contextElements.length > 0 && <ContextElements elements={question.contextElements} />}
            <p className="my-4 font-semibold text-2xl">{question.text}</p>
            {(question.type === 'radio' || question.type === 'checkbox') && (
              <ul className="space-y-3">
                {question.options.map((option, optionIndex) => (
                  <li key={optionIndex} className="flex items-center">
                    <input type={question.type} disabled className="mr-3" />
                    <span>{option}</span>
                  </li>
                ))}
              </ul>
            )}
            <button onClick={() => openQuestionModal(index)} className="absolute top-4 right-20 text-blue-500 hover:text-blue-700 transition-colors">
              <i className="fas fa-edit"></i>
            </button>
            <button onClick={handleDeleteQuestion} className="absolute top-4 right-4 text-red-500 hover:text-red-700 transition-colors">
              <i className="fas fa-trash"></i>
            </button>
          </div>
        );
      };

      // Preview Question Component
      const PreviewQuestion = ({ question }) => {
        return (
          <div className="mb-8 p-6 sm:p-8 bg-white dark:bg-gray-700 rounded-xl shadow">
            {question.contextElements && question.contextElements.length > 0 && <ContextElements elements={question.contextElements} />}
            <p className="my-4 font-semibold text-2xl dark:text-gray-100">{question.text}</p>
            {question.type === 'text' && (
              <input type="text" className="w-full p-3 border rounded focus:outline-none focus:ring dark:bg-gray-800 dark:border-gray-600 dark:text-gray-200" />
            )}
            {(question.type === 'radio' || question.type === 'checkbox') && (
              <ul className="space-y-4">
                {question.options.map((option, index) => (
                  <li key={index} className="flex items-center">
                    <input type={question.type} name={question.text.replace(/\s/g, '')} className="mr-4 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-200" />
                    <span className="dark:text-gray-200">{option}</span>
                  </li>
                ))}
              </ul>
            )}
          </div>
        );
      };

      // Page Content Component for Builder
      const PageContent = ({ openPageModal, openQuestionModal }) => {
        const { pages, currentPageIndex, deletePage: contextDeletePage } = useContext(SurveyContext);
        const currentPage = pages[currentPageIndex];

        const handleDeletePage = () => {
          contextDeletePage(currentPageIndex);
        };

        if (!currentPage) {
          return (
            <div>
              <h2 className="text-3xl font-bold mb-8">Page Content</h2>
              <div>Please select a page to view content.</div>
            </div>
          );
        }
        return (
          <div>
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10">
              <h2 className="text-3xl sm:text-4xl font-extrabold mb-4 sm:mb-0">{currentPage.title}</h2>
              <button onClick={() => openPageModal(true)} className="bg-white text-blue-500 hover:bg-blue-100 font-semibold py-3 px-6 sm:px-8 rounded-xl shadow transition-transform transform hover:scale-105">
                <i className="fas fa-edit mr-2"></i>Edit Page
              </button>
            </div>
            {currentPage.pageType === 'info' ? (
              <div className="p-6 sm:p-8 bg-white rounded-xl shadow">
                {currentPage.contextElements && currentPage.contextElements.length > 0
                  ? <ContextElements elements={currentPage.contextElements} />
                  : <p className="text-gray-600">No content added.</p>}
              </div>
            ) : (
              <div id="question-list" className="space-y-8">
                {currentPage.questions.map((question, index) => (
                  <Question
                    key={index}
                    question={question}
                    index={index}
                    openQuestionModal={openQuestionModal}
                    deleteQuestion={useContext(SurveyContext).deleteQuestion} // Access deleteQuestion from context here
                  />
                ))}
              </div>
            )}
            <div className="mt-6 flex flex-col sm:flex-row gap-4">
              {currentPage.pageType === 'survey' && (
                <button
                  id="add-question-btn"
                  onClick={openQuestionModal}
                  className="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 sm:py-4 sm:px-8 rounded-xl shadow transition-transform transform hover:scale-105"
                >
                  Add Question
                </button>
              )}
              <button
                id="delete-page-btn"
                onClick={handleDeletePage}
                className="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 sm:py-4 sm:px-8 rounded-xl shadow transition-transform transform hover:scale-105"
              >
                Delete Page
              </button>
            </div>
          </div>
        );
      };

      // Page Preview Component
      const PagePreview = () => {
        const { pages, previewPageIndex } = useContext(SurveyContext);
        if (pages.length === 0) {
          return <div className="p-6">No pages to preview.</div>;
        }
        const currentPage = pages[previewPageIndex];
        return (
          <div className="p-2">
            <h3 className="text-3xl sm:text-4xl font-bold mb-8 dark:text-gray-100">{currentPage.title}</h3>
            {currentPage.pageType === 'info'
              ? (currentPage.contextElements && currentPage.contextElements.length > 0
                  ? <ContextElements elements={currentPage.contextElements} />
                  : <p className="text-gray-600 dark:text-gray-400">No content added.</p>)
              : currentPage.questions.map((question, index) => (
                  <PreviewQuestion key={index} question={question} />
                ))
            }
          </div>
        );
      };

      // Page List Sidebar Component
      const PageListSidebar = ({ openPageModal }) => {
        const { pages, currentPageIndex, selectPage, movePageUp, movePageDown } = useContext(SurveyContext);
        return (
          <div className="md:w-1/4 p-4">
            <div className="mb-10">
              <h2 className="text-2xl sm:text-3xl font-bold mb-6">Survey Pages</h2>
              <ul className="space-y-4">
                {pages.map((page, index) => (
                  <li
                    key={index}
                    onClick={() => selectPage(index)}
                    className={`cursor-pointer p-4 rounded-xl flex justify-between items-center bg-white/70 dark:bg-gray-800/70 hover:bg-white/80 dark:hover:bg-gray-800/80 transition-all ${index === currentPageIndex ? 'shadow' : 'shadow-sm'}`}
                  >
                    <span className="font-semibold text-sm sm:text-base">{page.title}</span>
                    <div className="flex space-x-2">
                      <button onClick={(e) => { e.stopPropagation(); movePageUp(index); }} title="Move Up" className="text-gray-500 hover:text-gray-700">
                        <i className="fas fa-arrow-up"></i>
                      </button>
                      <button onClick={(e) => { e.stopPropagation(); movePageDown(index); }} title="Move Down" className="text-gray-500 hover:text-gray-700">
                        <i className="fas fa-arrow-down"></i>
                      </button>
                    </div>
                  </li>
                ))}
              </ul>
            </div>
            <button
              id="add-page-btn"
              onClick={openPageModal}
              className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 sm:py-4 sm:px-8 rounded-xl shadow transition-transform transform hover:scale-105"
            >
              Add Page
            </button>
          </div>
        );
      };

      // Tab Navigation Component
      const TabNavigation = ({ activeTab, switchTab }) => {
        return (
          <div className="mb-8 border-b border-gray-300 dark:border-gray-700">
            <ul className="flex space-x-4 sm:space-x-8">
              <li>
                <button
                  id="builder-tab"
                  className={`py-3 px-4 sm:py-4 sm:px-8 font-semibold rounded-t-xl transition-all ${activeTab === 'builder' ? 'bg-white dark:bg-gray-800 text-blue-500 shadow' : 'text-gray-600 dark:text-gray-400'}`}
                  onClick={() => switchTab('builder')}
                >
                  Builder
                </button>
              </li>
              <li>
                <button
                  id="preview-tab"
                  className={`py-3 px-4 sm:py-4 sm:px-8 font-semibold rounded-t-xl transition-all ${activeTab === 'preview' ? 'bg-white dark:bg-gray-800 text-blue-500 shadow' : 'text-gray-600 dark:text-gray-400'}`}
                  onClick={() => switchTab('preview')}
                >
                  Preview
                </button>
              </li>
            </ul>
          </div>
        );
      };

      // Context Element Editor Component (reusable for page and question)
      const ContextElementEditor = ({ elements, setElements }) => {
        const addContextElement = (elementType) => {
          setElements([...elements, { type: elementType, content: '' }]);
        };

        const removeContextElement = (index) => {
          setElements(elements.filter((_, i) => i !== index));
        };

        const updateContextElement = (index, value) => {
          const updatedElements = [...elements];
          updatedElements[index] = { ...updatedElements[index], content: value };
          setElements(updatedElements);
        };

        return (
          <div className="mb-4">
            <label className="block text-gray-700 dark:text-gray-300 font-bold mb-2">Context Elements</label>
            <div className="space-y-3">
              {elements.map((element, index) => (
                <div key={index} className="flex items-center space-x-3">
                  <label className="font-bold">
                    {element.type === 'paragraph'
                      ? 'Paragraph:'
                      : element.type === 'image'
                      ? 'Image URL:'
                      : element.type === 'video'
                      ? 'Video URL:'
                      : ''}
                  </label>
                  <input
                    type="text"
                    className="w-full p-2 border rounded focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200"
                    value={element.content}
                    onChange={(e) => updateContextElement(index, e.target.value)}
                  />
                  <button onClick={() => removeContextElement(index)} className="text-red-500 hover:text-red-700">
                    <i className="fas fa-times"></i>
                  </button>
                </div>
              ))}
            </div>
            <div className="flex gap-3 mt-3">
              <button type="button" onClick={() => addContextElement('paragraph')} className="bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 px-3 rounded">
                Add Paragraph
              </button>
              <button type="button" onClick={() => addContextElement('image')} className="bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 px-3 rounded">
                Add Image
              </button>
              <button type="button" onClick={() => addContextElement('video')} className="bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 px-3 rounded">
                Add Video
              </button>
            </div>
          </div>
        );
      };


      // Question Modal Component
      const QuestionModal = ({ isOpen, onClose, currentQuestionIndex, saveQuestion: contextSaveQuestion }) => {
        const [questionType, setQuestionType] = useState('text');
        const [questionText, setQuestionText] = useState('');
        const [options, setOptions] = useState([]);
        const [contextElements, setContextElements] = useState([]);

        const { pages, currentPageIndex, updateQuestion: contextUpdateQuestion, addQuestion: contextAddQuestion } = useContext(SurveyContext);
        const currentPage = pages[currentPageIndex];

        useEffect(() => {
          if (isOpen && currentQuestionIndex !== -1 && currentPage && currentPage.questions[currentQuestionIndex]) {
            const question = currentPage.questions[currentQuestionIndex];
            setQuestionType(question.type);
            setQuestionText(question.text);
            if (question.type === 'radio' || question.type === 'checkbox') {
              setOptions(question.options);
            }
            if (question.contextElements && question.contextElements.length > 0) {
              setContextElements(question.contextElements);
            }
          } else {
            setQuestionType('text');
            setQuestionText('');
            setOptions([]);
            setContextElements([]);
          }
        }, [isOpen, currentQuestionIndex, currentPage]);


        const handleSaveQuestion = () => {
          const newQuestion = {
            type: questionType,
            text: questionText,
            options: options,
            contextElements: contextElements
          };

          if (currentQuestionIndex === -1) {
            contextAddQuestion(currentPageIndex, newQuestion);
          } else {
            contextUpdateQuestion(currentPageIndex, currentQuestionIndex, newQuestion);
          }
          onClose();
        };


        const addOption = () => {
          setOptions([...options, '']);
        };

        const removeOption = (index) => {
          setOptions(options.filter((_, i) => i !== index));
        };

        const updateOption = (index, value) => {
          const updatedOptions = [...options];
          updatedOptions[index] = value;
          setOptions(updatedOptions);
        };

        const toggleOptionsVisibility = (e) => {
          setQuestionType(e.target.value);
        };


        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 flex items-center justify-center bg-black bg-opacity-70 z-50">
            <div className="bg-white dark:bg-gray-800 rounded-2xl shadow p-6 sm:p-8 w-11/12 max-w-md transition-all">
              <h2 className="text-xl sm:text-3xl font-bold mb-6 text-gray-800 dark:text-gray-200">
                {currentQuestionIndex === -1 ? 'Add Question' : 'Edit Question'}
              </h2>
              <div className="mb-4">
                <label htmlFor="question-type" className="block text-gray-700 dark:text-gray-300 font-bold mb-2">
                  Question Type
                </label>
                <select
                  id="question-type"
                  className="w-full p-3 border rounded focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200"
                  value={questionType}
                  onChange={toggleOptionsVisibility}
                >
                  <option value="text">Text</option>
                  <option value="radio">Radio</option>
                  <option value="checkbox">Checkbox</option>
                </select>
              </div>
              <div className="mb-4">
                <label htmlFor="question-text" className="block text-gray-700 dark:text-gray-300 font-bold mb-2">
                  Question Text
                </label>
                <input
                  type="text"
                  id="question-text"
                  className="w-full p-3 border rounded focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200"
                  value={questionText}
                  onChange={(e) => setQuestionText(e.target.value)}
                />
              </div>

              <ContextElementEditor elements={contextElements} setElements={setContextElements} />

              {(questionType === 'radio' || questionType === 'checkbox') && (
                <div className="mb-4">
                  <label className="block text-gray-700 dark:text-gray-300 font-bold mb-2">Options</label>
                  <ul className="space-y-2">
                    {options.map((option, index) => (
                      <li key={index} className="flex space-x-2">
                        <input
                          type="text"
                          className="w-full p-2 border rounded focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200"
                          value={option}
                          onChange={(e) => updateOption(index, e.target.value)}
                        />
                        <button onClick={() => removeOption(index)} className="text-red-500 hover:text-red-700">
                          <i className="fas fa-times"></i>
                        </button>
                      </li>
                    ))}
                  </ul>
                  <button type="button" onClick={addOption} className="mt-2 bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 px-3 rounded">
                    Add Option
                  </button>
                </div>
              )}

              <div className="flex justify-end gap-4">
                <button onClick={onClose} className="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded transition-transform transform hover:scale-105">
                  Cancel
                </button>
                <button onClick={handleSaveQuestion} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition-transform transform hover:scale-105">
                  Save
                </button>
              </div>
            </div>
          </div>
        );
      };

      // Page Modal Component
      const PageModal = ({ isOpen, onClose, isEditingPage, savePage: contextSavePage }) => {
        const [pageTitleInput, setPageTitleInput] = useState('');
        const [pageTypeInput, setPageTypeInput] = useState('survey');
        const [pageContextElements, setPageContextElements] = useState([]);

        const { pages, currentPageIndex, addPage: contextAddPage, updatePage: contextUpdatePage } = useContext(SurveyContext);
        const currentPage = pages[currentPageIndex];


        useEffect(() => {
          if (isOpen && isEditingPage && currentPage) {
            setPageTitleInput(currentPage.title);
            setPageTypeInput(currentPage.pageType || 'survey');
            setPageContextElements(currentPage.contextElements || []);
          } else {
            setPageTitleInput('');
            setPageTypeInput('survey');
            setPageContextElements([]);
          }
        }, [isOpen, isEditingPage, currentPage]);


        const handleSavePage = () => {
          const newPage = {
            title: pageTitleInput,
            pageType: pageTypeInput,
            questions: pageTypeInput === 'survey' ? [] : [],
            contextElements: pageTypeInput === 'info' ? pageContextElements : []
          };

          if (isEditingPage) {
            contextUpdatePage(currentPageIndex, {
              ...pages[currentPageIndex],
              title: pageTitleInput,
              pageType: pageTypeInput,
              contextElements: pageTypeInput === 'info' ? pageContextElements : []
            });
          } else {
            contextAddPage(newPage);
          }
          onClose();
        };


        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 flex items-center justify-center bg-black bg-opacity-70 z-50">
            <div className="bg-white dark:bg-gray-800 rounded-2xl shadow p-6 sm:p-8 w-11/12 max-w-md transition-all">
              <h2 className="text-xl sm:text-3xl font-bold mb-6 text-gray-800 dark:text-gray-200">
                {isEditingPage ? 'Edit Page' : 'Add Page'}
              </h2>
              <div className="mb-4">
                <label htmlFor="page-title-input" className="block text-gray-700 dark:text-gray-300 font-bold mb-2">
                  Page Title
                </label>
                <input
                  type="text"
                  id="page-title-input"
                  className="w-full p-3 border rounded focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200"
                  value={pageTitleInput}
                  onChange={(e) => setPageTitleInput(e.target.value)}
                />
              </div>
              <div className="mb-4">
                <label htmlFor="page-type" className="block text-gray-700 dark:text-gray-300 font-bold mb-2">
                  Page Type
                </label>
                <select
                  id="page-type"
                  value={pageTypeInput}
                  onChange={(e) => setPageTypeInput(e.target.value)}
                  className="w-full p-3 border rounded focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200"
                >
                  <option value="survey">Survey Page</option>
                  <option value="info">Information Page</option>
                </select>
              </div>
              {pageTypeInput === 'info' && (
                <ContextElementEditor elements={pageContextElements} setElements={setPageContextElements} />
              )}
              <div className="flex justify-end gap-4">
                <button onClick={onClose} className="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded transition-transform transform hover:scale-105">
                  Cancel
                </button>
                <button onClick={handleSavePage} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition-transform transform hover:scale-105">
                  Save
                </button>
              </div>
            </div>
          </div>
        );
      };


      const App = () => {
        const [activeTab, setActiveTab] = useState('builder');
        const [isPageModalOpen, setIsPageModalOpen] = useState(false);
        const [isEditingPage, setIsEditingPage] = useState(false);
        const [isQuestionModalOpen, setIsQuestionModalOpen] = useState(false);


        const openPageModal = (isEditing = false) => {
          setIsEditingPage(isEditing);
          setIsPageModalOpen(true);
        };

        const closePageModal = () => {
          setIsPageModalOpen(false);
          setIsEditingPage(false);
        };

        const openQuestionModal = (questionIndex = -1) => {
          setIsQuestionModalOpen(true);
        };

        const closeQuestionModal = () => {
          setIsQuestionModalOpen(false);
        };


        const switchTab = (tabName) => {
          setActiveTab(tabName);
        };

        const { showPreviousPreviewPage, showNextPreviewPage } = useContext(SurveyContext);


        return (
          <div className="mb-12">
            {/* Tab Navigation */}
            <TabNavigation activeTab={activeTab} switchTab={switchTab} />

            <div className={`flex flex-col md:flex-row ${activeTab !== 'builder' ? 'hidden' : ''}`}>
              {/* Sidebar */}
              <PageListSidebar openPageModal={openPageModal} />

              {/* Main Content */}
              <div className="md:w-3/4 p-4">
                <PageContent openPageModal={openPageModal} openQuestionModal={openQuestionModal} />
              </div>
            </div>

            {/* Preview Tab */}
            <div className={`mt-10 ${activeTab !== 'preview' ? 'hidden' : ''}`}>
              <div className="p-4 sm:p-8 bg-white dark:bg-gray-800 rounded-xl shadow">
                <h2 className="text-2xl sm:text-3xl font-bold mb-6 dark:text-gray-100">Survey Preview</h2>
                <div id="preview-container" className="space-y-6">
                  <PagePreview />
                </div>
                <div className="mt-6 flex justify-end gap-4">
                  <button
                    id="prev-page-btn"
                    onClick={showPreviousPreviewPage}
                    className={`bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-4 sm:py-4 sm:px-8 rounded-xl transition-transform transform hover:scale-105 ${useContext(SurveyContext).previewPageIndex === 0 ? 'hidden' : ''}`}
                  >
                    Previous
                  </button>
                  <button
                    id="next-page-btn"
                    onClick={showNextPreviewPage}
                    className={`bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 sm:py-4 sm:px-8 rounded-xl transition-transform transform hover:scale-105 ${useContext(SurveyContext).previewPageIndex === useContext(SurveyContext).pages.length - 1 ? 'hidden' : ''}`}
                  >
                    Next
                  </button>
                </div>
              </div>
            </div>

            {/* Question Modal */}
            <QuestionModal
              isOpen={isQuestionModalOpen}
              onClose={closeQuestionModal}
              currentQuestionIndex={useContext(SurveyContext).currentQuestionIndex}
              saveQuestion={useContext(SurveyContext).updateQuestion}
            />

            {/* Page Modal */}
            <PageModal
              isOpen={isPageModalOpen}
              onClose={closePageModal}
              isEditingPage={isEditingPage}
              savePage={useContext(SurveyContext).updatePage}
            />
          </div>
        );
      };

      const RootApp = () => (
        <SurveyContextProvider>
          <App />
        </SurveyContextProvider>
      );


      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<RootApp />);
    </script>
  </body>
</html>
