<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Builder</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-gray-50 to-gray-100 text-gray-800 dark:from-gray-900 dark:to-gray-800 dark:text-gray-200"
  >
    <!-- Header -->
    <header class="relative overflow-hidden">
      <div
        class="absolute inset-0 animate-pulse-slow bg-gradient-to-r from-purple-500 to-pink-500 opacity-70"
      ></div>
      <div class="container relative z-10 mx-auto px-4 py-8">
        <h1
          class="transform text-center text-4xl font-extrabold text-white drop-shadow-sm transition-transform hover:scale-105 sm:text-5xl"
        >
          Form Builder
        </h1>
      </div>
    </header>

    <div id="root" class="container mx-auto my-8 px-4"></div>

    <!-- React and Babel -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.0.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.0.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babel-standalone@6.26.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/babel">
      const React = window.React;
      const ReactDOM = window.ReactDOM;
      const { useState, useEffect, createContext, useContext } = React;

      // Form Context
      const FormContext = createContext();

      const FormContextProvider = ({ children }) => {
        const [pages, setPages] = useState([]);
        const [currentPageIndex, setCurrentPageIndex] = useState(-1);
        const [previewPageIndex, setPreviewPageIndex] = useState(0);

        useEffect(() => {
          loadFromLocalStorage();
          setupSampleForm();
        }, []);

        useEffect(() => {
          saveToLocalStorage();
        }, [pages]);

        const loadFromLocalStorage = () => {
          const storedData = localStorage.getItem("formData");
          if (storedData) {
            const parsedData = JSON.parse(storedData);
            setPages(parsedData);
            if (parsedData.length > 0) {
              setCurrentPageIndex(0);
            }
          }
        };

        const saveToLocalStorage = () => {
          localStorage.setItem("formData", JSON.stringify(pages));
        };

        const addPage = (newPage) => {
          setPages([...pages, newPage]);
          setCurrentPageIndex(pages.length);
        };

        const updatePage = (index, updatedPage) => {
          const updatedPages = [...pages];
          updatedPages[index] = updatedPage;
          setPages(updatedPages);
        };

        const deletePage = (index) => {
          const updatedPages = pages.filter((_, i) => i !== index);
          setPages(updatedPages);
          if (updatedPages.length === 0) {
            setCurrentPageIndex(-1);
            setPreviewPageIndex(0);
          } else {
            setCurrentPageIndex(Math.max(0, currentPageIndex - 1));
            setPreviewPageIndex(
              Math.min(previewPageIndex, updatedPages.length - 1),
            );
          }
        };

        const selectPage = (index) => {
          setCurrentPageIndex(index);
        };

        const movePageUp = (index) => {
          if (index <= 0) return;
          const updatedPages = [...pages];
          [updatedPages[index - 1], updatedPages[index]] = [
            updatedPages[index],
            updatedPages[index - 1],
          ];
          setPages(updatedPages);
          if (currentPageIndex === index) {
            setCurrentPageIndex(index - 1);
          } else if (currentPageIndex === index - 1) {
            setCurrentPageIndex(index);
          }
        };

        const movePageDown = (index) => {
          if (index >= pages.length - 1) return;
          const updatedPages = [...pages];
          [updatedPages[index + 1], updatedPages[index]] = [
            updatedPages[index],
            updatedPages[index + 1],
          ];
          setPages(updatedPages);
          if (currentPageIndex === index) {
            setCurrentPageIndex(index + 1);
          } else if (currentPageIndex === index + 1) {
            setCurrentPageIndex(index);
          }
        };

        const addQuestion = (pageIndex, newQuestion) => {
          if (pageIndex === -1) return;
          const updatedPages = [...pages];
          updatedPages[pageIndex].questions = [
            ...updatedPages[pageIndex].questions,
            newQuestion,
          ];
          setPages(updatedPages);
        };

        const updateQuestion = (pageIndex, questionIndex, updatedQuestion) => {
          if (pageIndex === -1) return;
          const updatedPages = [...pages];
          updatedPages[pageIndex].questions[questionIndex] = updatedQuestion;
          setPages(updatedPages);
        };

        const deleteQuestion = (pageIndex, questionIndex) => {
          if (pageIndex === -1) return;
          const updatedPages = [...pages];
          updatedPages[pageIndex].questions = updatedPages[
            pageIndex
          ].questions.filter((_, i) => i !== questionIndex);
          setPages(updatedPages);
        };

        const showPreviousPreviewPage = () => {
          if (previewPageIndex > 0) {
            setPreviewPageIndex(previewPageIndex - 1);
          }
        };

        const showNextPreviewPage = () => {
          if (previewPageIndex < pages.length - 1) {
            setPreviewPageIndex(previewPageIndex + 1);
          }
        };

        const setupSampleForm = () => {
          if (pages.length === 0) {
            addSamplePages();
          }
        };

        const addSamplePages = () => {
          const samplePages = [
            {
              title: "Customer Satisfaction Form - Page 1",
              pageType: "form",
              questions: [
                {
                  contextElements: [
                    {
                      type: "paragraph",
                      content:
                        "We value your input! Please provide your contact information below.",
                    },
                    {
                      type: "image",
                      content:
                        "https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=400&q=80",
                    },
                  ],
                  type: "text",
                  text: "What is your name?",
                },
                {
                  type: "text",
                  text: "What is your email address?",
                },
              ],
            },
            {
              title: "Information Page - About Us",
              pageType: "info",
              questions: [],
              contextElements: [
                {
                  type: "paragraph",
                  content:
                    "Discover our journey. We are dedicated to innovation and excellence.",
                },
                {
                  type: "image",
                  content:
                    "https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=400&q=80",
                },
              ],
            },
            {
              title: "Customer Satisfaction Form - Page 2",
              pageType: "form",
              questions: [
                {
                  contextElements: [
                    {
                      type: "video",
                      content: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                    },
                  ],
                  type: "radio",
                  text: "How satisfied are you with our service?",
                  options: [
                    "Very Satisfied",
                    "Satisfied",
                    "Neutral",
                    "Dissatisfied",
                    "Very Dissatisfied",
                  ],
                },
                {
                  type: "checkbox",
                  text: "Which aspects of our service did you like?",
                  options: [
                    "Speed",
                    "Quality",
                    "Price",
                    "Support",
                    "Ease of Use",
                  ],
                },
              ],
            },
          ];
          setPages(samplePages);
          setCurrentPageIndex(0);
        };

        const value = {
          pages,
          currentPageIndex,
          previewPageIndex,
          setPages,
          setCurrentPageIndex,
          setPreviewPageIndex,
          addPage,
          updatePage,
          deletePage,
          selectPage,
          movePageUp,
          movePageDown,
          addQuestion,
          updateQuestion,
          deleteQuestion,
          showPreviousPreviewPage,
          showNextPreviewPage,
        };

        return (
          <FormContext.Provider value={value}>{children}</FormContext.Provider>
        );
      };

      // Context Element Component
      const ContextElements = ({ elements }) => {
        if (!elements || elements.length === 0) {
          return null;
        }
        return (
          <div className='space-y-4'>
            {elements.map((element, index) => {
              if (element.type === "paragraph") {
                return (
                  <p key={index} className='text-base'>
                    {element.content}
                  </p>
                );
              } else if (element.type === "image") {
                return (
                  <img
                    key={index}
                    src={element.content}
                    alt='Context'
                    className='w-full rounded-lg shadow-sm'
                  />
                );
              } else if (element.type === "video") {
                return (
                  <div
                    key={index}
                    className='aspect-video w-full overflow-hidden rounded-lg shadow-sm'
                  >
                    <iframe
                      src={element.content}
                      title='Video'
                      className='h-full w-full'
                      frameBorder='0'
                      allowFullScreen
                    ></iframe>
                  </div>
                );
              }
              return null;
            })}
          </div>
        );
      };

      // Question Component for Builder
      const Question = ({
        question,
        index,
        openQuestionModal,
        deleteQuestion,
      }) => {
        const { currentPageIndex } = useContext(FormContext);
        const handleDeleteQuestion = () => {
          deleteQuestion(currentPageIndex, index);
        };

        return (
          <div
            key={index}
            className='relative rounded-xl border bg-white p-6 shadow-sm transition-shadow hover:shadow dark:bg-gray-800'
          >
            {question.contextElements &&
              question.contextElements.length > 0 && (
                <ContextElements elements={question.contextElements} />
              )}
            <p className='my-4 text-2xl font-semibold'>{question.text}</p>
            {(question.type === "radio" || question.type === "checkbox") && (
              <ul className='space-y-3'>
                {question.options.map((option, optionIndex) => (
                  <li key={optionIndex} className='flex items-center'>
                    <input type={question.type} disabled className='mr-3' />
                    <span>{option}</span>
                  </li>
                ))}
              </ul>
            )}
            <button
              onClick={() => openQuestionModal(index)}
              className='absolute right-20 top-4 text-blue-500 transition-colors hover:text-blue-700'
            >
              <i className='fas fa-edit'></i>
            </button>
            <button
              onClick={handleDeleteQuestion}
              className='absolute right-4 top-4 text-red-500 transition-colors hover:text-red-700'
            >
              <i className='fas fa-trash'></i>
            </button>
          </div>
        );
      };

      // Preview Question Component
      const PreviewQuestion = ({ question }) => {
        return (
          <div className='mb-8 rounded-xl bg-white p-6 shadow dark:bg-gray-700 sm:p-8'>
            {question.contextElements &&
              question.contextElements.length > 0 && (
                <ContextElements elements={question.contextElements} />
              )}
            <p className='my-4 text-2xl font-semibold dark:text-gray-100'>
              {question.text}
            </p>
            {question.type === "text" && (
              <input
                type='text'
                className='w-full rounded border p-3 focus:outline-none focus:ring dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200'
              />
            )}
            {(question.type === "radio" || question.type === "checkbox") && (
              <ul className='space-y-4'>
                {question.options.map((option, index) => (
                  <li key={index} className='flex items-center'>
                    <input
                      type={question.type}
                      name={question.text.replace(/\s/g, "")}
                      className='mr-4 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200'
                    />
                    <span className='dark:text-gray-200'>{option}</span>
                  </li>
                ))}
              </ul>
            )}
          </div>
        );
      };

      // Page Content Component for Builder
      const PageContent = ({ openPageModal, openQuestionModal }) => {
        const {
          pages,
          currentPageIndex,
          deletePage: contextDeletePage,
        } = useContext(FormContext);
        const currentPage = pages[currentPageIndex];

        const handleDeletePage = () => {
          contextDeletePage(currentPageIndex);
        };

        if (!currentPage) {
          return (
            <div>
              <h2 className='mb-8 text-3xl font-bold'>Page Content</h2>
              <div>Please select a page to view content.</div>
            </div>
          );
        }
        return (
          <div>
            <div className='mb-10 flex flex-col items-start justify-between sm:flex-row sm:items-center'>
              <h2 className='mb-4 text-3xl font-extrabold sm:mb-0 sm:text-4xl'>
                {currentPage.title}
              </h2>
              <button
                onClick={() => openPageModal(true)}
                className='transform rounded-xl bg-white px-6 py-3 font-semibold text-blue-500 shadow transition-transform hover:scale-105 hover:bg-blue-100 sm:px-8'
              >
                <i className='fas fa-edit mr-2'></i>Edit Page
              </button>
            </div>
            {currentPage.pageType === "info" ? (
              <div className='rounded-xl bg-white p-6 shadow sm:p-8'>
                {currentPage.contextElements &&
                currentPage.contextElements.length > 0 ? (
                  <ContextElements elements={currentPage.contextElements} />
                ) : (
                  <p className='text-gray-600'>No content added.</p>
                )}
              </div>
            ) : (
              <div id='question-list' className='space-y-8'>
                {currentPage.questions.map((question, index) => (
                  <Question
                    key={index}
                    question={question}
                    index={index}
                    openQuestionModal={openQuestionModal}
                    deleteQuestion={useContext(FormContext).deleteQuestion} // Access deleteQuestion from context here
                  />
                ))}
              </div>
            )}
            <div className='mt-6 flex flex-col gap-4 sm:flex-row'>
              {currentPage.pageType === "form" && (
                <button
                  id='add-question-btn'
                  onClick={openQuestionModal}
                  className='transform rounded-xl bg-green-500 px-4 py-3 font-bold text-white shadow transition-transform hover:scale-105 hover:bg-green-600 sm:px-8 sm:py-4'
                >
                  Add Question
                </button>
              )}
              <button
                id='delete-page-btn'
                onClick={handleDeletePage}
                className='transform rounded-xl bg-red-500 px-4 py-3 font-bold text-white shadow transition-transform hover:scale-105 hover:bg-red-600 sm:px-8 sm:py-4'
              >
                Delete Page
              </button>
            </div>
          </div>
        );
      };

      // Page Preview Component
      const PagePreview = () => {
        const { pages, previewPageIndex } = useContext(FormContext);
        if (pages.length === 0) {
          return <div className='p-6'>No pages to preview.</div>;
        }
        const currentPage = pages[previewPageIndex];
        return (
          <div className='p-2'>
            <h3 className='mb-8 text-3xl font-bold dark:text-gray-100 sm:text-4xl'>
              {currentPage.title}
            </h3>
            {currentPage.pageType === "info" ? (
              currentPage.contextElements &&
              currentPage.contextElements.length > 0 ? (
                <ContextElements elements={currentPage.contextElements} />
              ) : (
                <p className='text-gray-600 dark:text-gray-400'>
                  No content added.
                </p>
              )
            ) : (
              currentPage.questions.map((question, index) => (
                <PreviewQuestion key={index} question={question} />
              ))
            )}
          </div>
        );
      };

      // Page List Sidebar Component
      const PageListSidebar = ({ openPageModal }) => {
        const {
          pages,
          currentPageIndex,
          selectPage,
          movePageUp,
          movePageDown,
        } = useContext(FormContext);
        return (
          <div className='p-4 md:w-1/4'>
            <div className='mb-10'>
              <h2 className='mb-6 text-2xl font-bold sm:text-3xl'>
                Form Pages
              </h2>
              <ul className='space-y-4'>
                {pages.map((page, index) => (
                  <li
                    key={index}
                    onClick={() => selectPage(index)}
                    className={`flex cursor-pointer items-center justify-between rounded-xl bg-white/70 p-4 transition-all hover:bg-white/80 dark:bg-gray-800/70 dark:hover:bg-gray-800/80 ${index === currentPageIndex ? "shadow" : "shadow-sm"}`}
                  >
                    <span className='text-sm font-semibold sm:text-base'>
                      {page.title}
                    </span>
                    <div className='flex space-x-2'>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          movePageUp(index);
                        }}
                        title='Move Up'
                        className='text-gray-500 hover:text-gray-700'
                      >
                        <i className='fas fa-arrow-up'></i>
                      </button>
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          movePageDown(index);
                        }}
                        title='Move Down'
                        className='text-gray-500 hover:text-gray-700'
                      >
                        <i className='fas fa-arrow-down'></i>
                      </button>
                    </div>
                  </li>
                ))}
              </ul>
            </div>
            <button
              id='add-page-btn'
              onClick={openPageModal}
              className='w-full transform rounded-xl bg-blue-500 px-4 py-3 font-bold text-white shadow transition-transform hover:scale-105 hover:bg-blue-600 sm:px-8 sm:py-4'
            >
              Add Page
            </button>
          </div>
        );
      };

      // Tab Navigation Component
      const TabNavigation = ({ activeTab, switchTab }) => {
        return (
          <div className='mb-8 border-b border-gray-300 dark:border-gray-700'>
            <ul className='flex space-x-4 sm:space-x-8'>
              <li>
                <button
                  id='builder-tab'
                  className={`rounded-t-xl px-4 py-3 font-semibold transition-all sm:px-8 sm:py-4 ${activeTab === "builder" ? "bg-white text-blue-500 shadow dark:bg-gray-800" : "text-gray-600 dark:text-gray-400"}`}
                  onClick={() => switchTab("builder")}
                >
                  Builder
                </button>
              </li>
              <li>
                <button
                  id='preview-tab'
                  className={`rounded-t-xl px-4 py-3 font-semibold transition-all sm:px-8 sm:py-4 ${activeTab === "preview" ? "bg-white text-blue-500 shadow dark:bg-gray-800" : "text-gray-600 dark:text-gray-400"}`}
                  onClick={() => switchTab("preview")}
                >
                  Preview
                </button>
              </li>
            </ul>
          </div>
        );
      };

      // Context Element Editor Component (reusable for page and question)
      const ContextElementEditor = ({ elements, setElements }) => {
        const addContextElement = (elementType) => {
          setElements([...elements, { type: elementType, content: "" }]);
        };

        const removeContextElement = (index) => {
          setElements(elements.filter((_, i) => i !== index));
        };

        const updateContextElement = (index, value) => {
          const updatedElements = [...elements];
          updatedElements[index] = {
            ...updatedElements[index],
            content: value,
          };
          setElements(updatedElements);
        };

        return (
          <div className='mb-4'>
            <label className='mb-2 block font-bold text-gray-700 dark:text-gray-300'>
              Context Elements
            </label>
            <div className='space-y-3'>
              {elements.map((element, index) => (
                <div key={index} className='flex items-center space-x-3'>
                  <label className='font-bold'>
                    {element.type === "paragraph"
                      ? "Paragraph:"
                      : element.type === "image"
                        ? "Image URL:"
                        : element.type === "video"
                          ? "Video URL:"
                          : ""}
                  </label>
                  <input
                    type='text'
                    className='w-full rounded border p-2 focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200'
                    value={element.content}
                    onChange={(e) =>
                      updateContextElement(index, e.target.value)
                    }
                  />
                  <button
                    onClick={() => removeContextElement(index)}
                    className='text-red-500 hover:text-red-700'
                  >
                    <i className='fas fa-times'></i>
                  </button>
                </div>
              ))}
            </div>
            <div className='mt-3 flex gap-3'>
              <button
                type='button'
                onClick={() => addContextElement("paragraph")}
                className='rounded bg-gray-200 px-3 py-2 text-gray-800 hover:bg-gray-300'
              >
                Add Paragraph
              </button>
              <button
                type='button'
                onClick={() => addContextElement("image")}
                className='rounded bg-gray-200 px-3 py-2 text-gray-800 hover:bg-gray-300'
              >
                Add Image
              </button>
              <button
                type='button'
                onClick={() => addContextElement("video")}
                className='rounded bg-gray-200 px-3 py-2 text-gray-800 hover:bg-gray-300'
              >
                Add Video
              </button>
            </div>
          </div>
        );
      };

      // Question Modal Component
      const QuestionModal = ({
        isOpen,
        onClose,
        currentQuestionIndex,
        saveQuestion: contextSaveQuestion,
      }) => {
        const [questionType, setQuestionType] = useState("text");
        const [questionText, setQuestionText] = useState("");
        const [options, setOptions] = useState([]);
        const [contextElements, setContextElements] = useState([]);

        const {
          pages,
          currentPageIndex,
          updateQuestion: contextUpdateQuestion,
          addQuestion: contextAddQuestion,
        } = useContext(FormContext);
        const currentPage = pages[currentPageIndex];

        useEffect(() => {
          if (
            isOpen &&
            currentQuestionIndex !== -1 &&
            currentPage &&
            currentPage.questions[currentQuestionIndex]
          ) {
            const question = currentPage.questions[currentQuestionIndex];
            setQuestionType(question.type);
            setQuestionText(question.text);
            if (question.type === "radio" || question.type === "checkbox") {
              setOptions(question.options);
            }
            if (
              question.contextElements &&
              question.contextElements.length > 0
            ) {
              setContextElements(question.contextElements);
            }
          } else {
            setQuestionType("text");
            setQuestionText("");
            setOptions([]);
            setContextElements([]);
          }
        }, [isOpen, currentQuestionIndex, currentPage]);

        const handleSaveQuestion = () => {
          const newQuestion = {
            type: questionType,
            text: questionText,
            options: options,
            contextElements: contextElements,
          };

          if (currentQuestionIndex === -1) {
            contextAddQuestion(currentPageIndex, newQuestion);
          } else {
            contextUpdateQuestion(
              currentPageIndex,
              currentQuestionIndex,
              newQuestion,
            );
          }
          onClose();
        };

        const addOption = () => {
          setOptions([...options, ""]);
        };

        const removeOption = (index) => {
          setOptions(options.filter((_, i) => i !== index));
        };

        const updateOption = (index, value) => {
          const updatedOptions = [...options];
          updatedOptions[index] = value;
          setOptions(updatedOptions);
        };

        const toggleOptionsVisibility = (e) => {
          setQuestionType(e.target.value);
        };

        if (!isOpen) return null;

        return (
          <div className='fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70'>
            <div className='w-11/12 max-w-md rounded-2xl bg-white p-6 shadow transition-all dark:bg-gray-800 sm:p-8'>
              <h2 className='mb-6 text-xl font-bold text-gray-800 dark:text-gray-200 sm:text-3xl'>
                {currentQuestionIndex === -1 ? "Add Question" : "Edit Question"}
              </h2>
              <div className='mb-4'>
                <label
                  htmlFor='question-type'
                  className='mb-2 block font-bold text-gray-700 dark:text-gray-300'
                >
                  Question Type
                </label>
                <select
                  id='question-type'
                  className='w-full rounded border p-3 focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200'
                  value={questionType}
                  onChange={toggleOptionsVisibility}
                >
                  <option value='text'>Text</option>
                  <option value='radio'>Radio</option>
                  <option value='checkbox'>Checkbox</option>
                </select>
              </div>
              <div className='mb-4'>
                <label
                  htmlFor='question-text'
                  className='mb-2 block font-bold text-gray-700 dark:text-gray-300'
                >
                  Question Text
                </label>
                <input
                  type='text'
                  id='question-text'
                  className='w-full rounded border p-3 focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200'
                  value={questionText}
                  onChange={(e) => setQuestionText(e.target.value)}
                />
              </div>

              <ContextElementEditor
                elements={contextElements}
                setElements={setContextElements}
              />

              {(questionType === "radio" || questionType === "checkbox") && (
                <div className='mb-4'>
                  <label className='mb-2 block font-bold text-gray-700 dark:text-gray-300'>
                    Options
                  </label>
                  <ul className='space-y-2'>
                    {options.map((option, index) => (
                      <li key={index} className='flex space-x-2'>
                        <input
                          type='text'
                          className='w-full rounded border p-2 focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200'
                          value={option}
                          onChange={(e) => updateOption(index, e.target.value)}
                        />
                        <button
                          onClick={() => removeOption(index)}
                          className='text-red-500 hover:text-red-700'
                        >
                          <i className='fas fa-times'></i>
                        </button>
                      </li>
                    ))}
                  </ul>
                  <button
                    type='button'
                    onClick={addOption}
                    className='mt-2 rounded bg-gray-200 px-3 py-2 text-gray-800 hover:bg-gray-300'
                  >
                    Add Option
                  </button>
                </div>
              )}

              <div className='flex justify-end gap-4'>
                <button
                  onClick={onClose}
                  className='transform rounded bg-gray-400 px-4 py-2 font-bold text-white transition-transform hover:scale-105 hover:bg-gray-500'
                >
                  Cancel
                </button>
                <button
                  onClick={handleSaveQuestion}
                  className='transform rounded bg-blue-500 px-4 py-2 font-bold text-white transition-transform hover:scale-105 hover:bg-blue-600'
                >
                  Save
                </button>
              </div>
            </div>
          </div>
        );
      };

      // Page Modal Component
      const PageModal = ({
        isOpen,
        onClose,
        isEditingPage,
        savePage: contextSavePage,
      }) => {
        const [pageTitleInput, setPageTitleInput] = useState("");
        const [pageTypeInput, setPageTypeInput] = useState("form");
        const [pageContextElements, setPageContextElements] = useState([]);

        const {
          pages,
          currentPageIndex,
          addPage: contextAddPage,
          updatePage: contextUpdatePage,
        } = useContext(FormContext);
        const currentPage = pages[currentPageIndex];

        useEffect(() => {
          if (isOpen && isEditingPage && currentPage) {
            setPageTitleInput(currentPage.title);
            setPageTypeInput(currentPage.pageType || "form");
            setPageContextElements(currentPage.contextElements || []);
          } else {
            setPageTitleInput("");
            setPageTypeInput("form");
            setPageContextElements([]);
          }
        }, [isOpen, isEditingPage, currentPage]);

        const handleSavePage = () => {
          const newPage = {
            title: pageTitleInput,
            pageType: pageTypeInput,
            questions: pageTypeInput === "form" ? [] : [],
            contextElements:
              pageTypeInput === "info" ? pageContextElements : [],
          };

          if (isEditingPage) {
            contextUpdatePage(currentPageIndex, {
              ...pages[currentPageIndex],
              title: pageTitleInput,
              pageType: pageTypeInput,
              contextElements:
                pageTypeInput === "info" ? pageContextElements : [],
            });
          } else {
            contextAddPage(newPage);
          }
          onClose();
        };

        if (!isOpen) return null;

        return (
          <div className='fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70'>
            <div className='w-11/12 max-w-md rounded-2xl bg-white p-6 shadow transition-all dark:bg-gray-800 sm:p-8'>
              <h2 className='mb-6 text-xl font-bold text-gray-800 dark:text-gray-200 sm:text-3xl'>
                {isEditingPage ? "Edit Page" : "Add Page"}
              </h2>
              <div className='mb-4'>
                <label
                  htmlFor='page-title-input'
                  className='mb-2 block font-bold text-gray-700 dark:text-gray-300'
                >
                  Page Title
                </label>
                <input
                  type='text'
                  id='page-title-input'
                  className='w-full rounded border p-3 focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200'
                  value={pageTitleInput}
                  onChange={(e) => setPageTitleInput(e.target.value)}
                />
              </div>
              <div className='mb-4'>
                <label
                  htmlFor='page-type'
                  className='mb-2 block font-bold text-gray-700 dark:text-gray-300'
                >
                  Page Type
                </label>
                <select
                  id='page-type'
                  value={pageTypeInput}
                  onChange={(e) => setPageTypeInput(e.target.value)}
                  className='w-full rounded border p-3 focus:outline-none focus:ring dark:bg-gray-700 dark:text-gray-200'
                >
                  <option value='form'>Form Page</option>
                  <option value='info'>Information Page</option>
                </select>
              </div>
              {pageTypeInput === "info" && (
                <ContextElementEditor
                  elements={pageContextElements}
                  setElements={setPageContextElements}
                />
              )}
              <div className='flex justify-end gap-4'>
                <button
                  onClick={onClose}
                  className='transform rounded bg-gray-400 px-4 py-2 font-bold text-white transition-transform hover:scale-105 hover:bg-gray-500'
                >
                  Cancel
                </button>
                <button
                  onClick={handleSavePage}
                  className='transform rounded bg-blue-500 px-4 py-2 font-bold text-white transition-transform hover:scale-105 hover:bg-blue-600'
                >
                  Save
                </button>
              </div>
            </div>
          </div>
        );
      };

      const App = () => {
        const [activeTab, setActiveTab] = useState("builder");
        const [isPageModalOpen, setIsPageModalOpen] = useState(false);
        const [isEditingPage, setIsEditingPage] = useState(false);
        const [isQuestionModalOpen, setIsQuestionModalOpen] = useState(false);

        const openPageModal = (isEditing = false) => {
          setIsEditingPage(isEditing);
          setIsPageModalOpen(true);
        };

        const closePageModal = () => {
          setIsPageModalOpen(false);
          setIsEditingPage(false);
        };

        const openQuestionModal = (questionIndex = -1) => {
          setIsQuestionModalOpen(true);
        };

        const closeQuestionModal = () => {
          setIsQuestionModalOpen(false);
        };

        const switchTab = (tabName) => {
          setActiveTab(tabName);
        };

        const { showPreviousPreviewPage, showNextPreviewPage } =
          useContext(FormContext);

        return (
          <div className='mb-12'>
            {/* Tab Navigation */}
            <TabNavigation activeTab={activeTab} switchTab={switchTab} />

            <div
              className={`flex flex-col md:flex-row ${activeTab !== "builder" ? "hidden" : ""}`}
            >
              {/* Sidebar */}
              <PageListSidebar openPageModal={openPageModal} />

              {/* Main Content */}
              <div className='p-4 md:w-3/4'>
                <PageContent
                  openPageModal={openPageModal}
                  openQuestionModal={openQuestionModal}
                />
              </div>
            </div>

            {/* Preview Tab */}
            <div className={`mt-10 ${activeTab !== "preview" ? "hidden" : ""}`}>
              <div className='rounded-xl bg-white p-4 shadow dark:bg-gray-800 sm:p-8'>
                <h2 className='mb-6 text-2xl font-bold dark:text-gray-100 sm:text-3xl'>
                  Form Preview
                </h2>
                <div id='preview-container' className='space-y-6'>
                  <PagePreview />
                </div>
                <div className='mt-6 flex justify-end gap-4'>
                  <button
                    id='prev-page-btn'
                    onClick={showPreviousPreviewPage}
                    className={`transform rounded-xl bg-gray-400 px-4 py-3 font-bold text-white transition-transform hover:scale-105 hover:bg-gray-500 sm:px-8 sm:py-4 ${useContext(FormContext).previewPageIndex === 0 ? "hidden" : ""}`}
                  >
                    Previous
                  </button>
                  <button
                    id='next-page-btn'
                    onClick={showNextPreviewPage}
                    className={`transform rounded-xl bg-blue-500 px-4 py-3 font-bold text-white transition-transform hover:scale-105 hover:bg-blue-600 sm:px-8 sm:py-4 ${useContext(FormContext).previewPageIndex === useContext(FormContext).pages.length - 1 ? "hidden" : ""}`}
                  >
                    Next
                  </button>
                </div>
              </div>
            </div>

            {/* Question Modal */}
            <QuestionModal
              isOpen={isQuestionModalOpen}
              onClose={closeQuestionModal}
              currentQuestionIndex={
                useContext(FormContext).currentQuestionIndex
              }
              saveQuestion={useContext(FormContext).updateQuestion}
            />

            {/* Page Modal */}
            <PageModal
              isOpen={isPageModalOpen}
              onClose={closePageModal}
              isEditingPage={isEditingPage}
              savePage={useContext(FormContext).updatePage}
            />
          </div>
        );
      };

      const RootApp = () => (
        <FormContextProvider>
          <App />
        </FormContextProvider>
      );

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<RootApp />);
    </script>
  </body>
</html>
